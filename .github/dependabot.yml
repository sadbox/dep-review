# Dependabot for this repository. Its pull requests are read and merged by
# hand: this repository does not run the gate on itself (it has no caller
# workflow).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
