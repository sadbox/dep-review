# The Dependabot review gate (reusable workflow). See README.md for the
# design and examples/ for what a repository adds to use it.
#
# Trust layout, which every change here must keep:
#   - classify, fetch: no secrets, read-only token. fetch downloads both
#     versions of each dependency and diffs them; it never executes
#     anything from the PR or from a dependency.
#   - review: the ONLY job with a model. Read-only token, no secrets. The
#     model runs in a gVisor sandbox with no credentials and no network
#     except a proxy that holds the short-lived federated token (OIDC) and
#     forwards only POST /v1/messages. Tools are Read/Grep/Glob on
#     ./evidence and ./repo only. Its output is a schema-checked verdict,
#     nothing else.
#   - publish, sweep: no model and no untrusted text in any shell. They hold
#     the gate app's token (environment `dep-review`, default branch only)
#     and merge only a head SHA that classify verified and the verdict
#     approved.
name: dep-review gate

on:
  workflow_call:
    inputs:
      trigger_workflow_path:
        description: The caller's no-op pull_request workflow whose completion starts the gate.
        type: string
        default: .github/workflows/dep-review-trigger.yaml
      notes_path:
        description: Repository-specific review notes, read from the default branch.
        type: string
        default: .github/dep-review.md
      model:
        type: string
        default: claude-opus-5-5
      anthropic_federation_rule_id:
        type: string
        required: true
      anthropic_organization_id:
        type: string
        required: true
      anthropic_workspace_id:
        type: string
        default: ""
      anthropic_service_account_id:
        description: Service account (svac_...) the federated token acts as; optional.
        type: string
        default: ""
      max_model_requests:
        description: Messages API requests the credential proxy allows per review.
        type: number
        default: 200
    # Declared so callers pass these and nothing else (no `secrets: inherit`).
    # publish and sweep run in the caller's `dep-review` environment, and an
    # environment secret of the same name takes precedence over a passed one,
    # so the usual setup (all three as environment secrets) works with the
    # pass-through in examples/dep-review.yaml; none is required at call time
    # for that reason. publish and sweep fail without DEP_REVIEW_APP_KEY.
    secrets:
      DEP_REVIEW_APP_KEY:
        description: The gate app's private key (normally a `dep-review` environment secret).
        required: false
      PUSHOVER_APP_TOKEN:
        description: Optional Pushover notifications.
        required: false
      PUSHOVER_USER_KEY:
        description: Optional Pushover notifications.
        required: false

permissions: {}

env:
  # Backstops for "never run the dependencies' code".
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0"
  npm_config_ignore_scripts: "true"

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      gate_sums: ${{ steps.sums.outputs.sums }}
    steps:
      - name: Check out the gate (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gate
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: gate/go.mod
          cache: false
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -C gate -trimpath -o "$RUNNER_TEMP/bin/dep-review" ./cmd/dep-review
          # go.mod: the fetch job sets up the gate's Go version from it.
          # sandbox/: the review job's Dockerfile, CLI lockfile and gVisor
          # installer.
          cp gate/prompts/review.md gate/schema/verdict.json gate/go.mod "$RUNNER_TEMP/bin/"
          mkdir "$RUNNER_TEMP/bin/sandbox"
          cp gate/sandbox/Dockerfile gate/sandbox/package.json gate/sandbox/package-lock.json gate/sandbox/install-gvisor.sh "$RUNNER_TEMP/bin/sandbox/"
      - name: Checksum the gate's files
        id: sums
        run: |
          cd "$RUNNER_TEMP/bin"
          {
            echo 'sums<<DEP_REVIEW_SUMS'
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            echo 'DEP_REVIEW_SUMS'
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
          retention-days: 1

  classify:
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          chmod +x dep-review
      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PATH: ${{ inputs.trigger_workflow_path }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" classify \
            --event "$GITHUB_EVENT_PATH" \
            --trigger-path "$TRIGGER_PATH" \
            --out "$RUNNER_TEMP/out/classification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classification
          path: ${{ runner.temp }}/out/classification.json
          retention-days: 7

  fetch:
    needs: [build, classify]
    if: needs.classify.outputs.kind == 'dependabot'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      route: ${{ steps.fetch.outputs.route }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          chmod +x dep-review
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: classification
          path: ${{ runner.temp }}/in
      # The go_modules fetcher runs `go mod download` (downloads and sum
      # checks only, in an empty module of its own). The version comes
      # from the gate's go.mod, never the PR's; no cache, since a cache
      # restored into a job that handles untrusted code can be poisoned.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ runner.temp }}/bin/go.mod
          cache: false
      - name: Check out the PR (data only; nothing from it is executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and verify
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" fetch \
            --classification "$RUNNER_TEMP/in/classification.json" \
            --repo-dir pr \
            --out "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 7

  review:
    needs: [build, classify, fetch]
    if: needs.fetch.outputs.route == 'review'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The federated model credential. The OIDC request token (which is
      # also the job's runtime token) stays in `dep-review review` on the
      # host; the proxy container gets only Claude-audience JWTs from it
      # over a unix socket, and the reviewer gets nothing.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          chmod +x dep-review
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: evidence
      - name: Check out the default branch (for usage search and the review notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - name: Install gVisor
        run: bash "$RUNNER_TEMP/bin/sandbox/install-gvisor.sh"
      # Built here, only when a review runs, from the gate's own pinned
      # Dockerfile: base images by digest, the CLI by package-lock
      # integrity, installed with --ignore-scripts. No build cache.
      - name: Build the sandbox images
        run: |
          docker build --no-cache -t dep-review-reviewer:local "$RUNNER_TEMP/bin/sandbox"
          docker build --no-cache --target proxy -t dep-review-proxy:local "$RUNNER_TEMP/bin/sandbox"
      - name: Prepare prompt and settings
        env:
          NOTES_PATH: ${{ inputs.notes_path }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" review-prep \
            --prompt "$RUNNER_TEMP/bin/review.md" \
            --schema "$RUNNER_TEMP/bin/verdict.json" \
            --notes "repo/$NOTES_PATH" \
            --out-dir "$RUNNER_TEMP/review"
      # The reviewer runs under gVisor on an internal network whose only
      # other member is the credential proxy (see README.md, "Sandbox").
      # Its verdict comes back on stdout and is validated before
      # verdict.json is written; with no valid verdict this step fails,
      # the upload is skipped and publish sends the PR to a human.
      - name: Review (sandboxed)
        env:
          MODEL: ${{ inputs.model }}
          RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
          ORG_ID: ${{ inputs.anthropic_organization_id }}
          WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
          SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
          MAX_REQUESTS: ${{ inputs.max_model_requests }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" review \
            --prep-dir "$RUNNER_TEMP/review" \
            --evidence evidence \
            --repo repo \
            --out "$RUNNER_TEMP/verdict/verdict.json" \
            --reviewer-image dep-review-reviewer:local \
            --proxy-image dep-review-proxy:local \
            --model "$MODEL" \
            --federation-rule-id "$RULE_ID" \
            --organization-id "$ORG_ID" \
            --workspace-id "$WORKSPACE_ID" \
            --service-account-id "$SERVICE_ACCOUNT_ID" \
            --max-requests "$MAX_REQUESTS" \
            --max-turns 80 \
            --timeout 20m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict/verdict.json
          retention-days: 7

  publish:
    needs: [build, classify, fetch, review]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.classify.outputs.kind == 'dependabot' || needs.classify.outputs.kind == 'dependabot-unverified')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: dep-review
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/in
          pattern: "{gate-bin,classification,evidence,verdict}"
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/in/gate-bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          chmod +x dep-review
      - name: Gate app token (this repository only)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DEP_REVIEW_APP_ID }}
          private-key: ${{ secrets.DEP_REVIEW_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write
          permission-checks: read
          permission-actions: read
      - name: Decide, comment, merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # "<slug>[bot]" is how publish recognises its own comment.
          DEP_REVIEW_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          FETCH_RESULT: ${{ needs.fetch.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          "$RUNNER_TEMP/in/gate-bin/dep-review" publish \
            --in "$RUNNER_TEMP/in" \
            --fetch-result "$FETCH_RESULT" \
            --review-result "$REVIEW_RESULT"

  sweep:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: dep-review
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          chmod +x dep-review
      - name: Gate app token (this repository only)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DEP_REVIEW_APP_ID }}
          private-key: ${{ secrets.DEP_REVIEW_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write
          permission-checks: read
          permission-actions: read
      - name: Merge approved PRs whose CI finished; report stuck ones
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # Only a dep-review status created by "<slug>[bot]" counts as approval.
          DEP_REVIEW_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" sweep --repo "$GITHUB_REPOSITORY"
