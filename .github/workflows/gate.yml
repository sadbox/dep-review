# The Dependabot merge gate (reusable workflow). See README.md for the
# rule and examples/ for what a repository adds to use it.
#
# Trust layout, which every change here must keep:
#   - Every job runs the gate that this run's build job built from this
#     workflow's own commit, and only after checking it against the build
#     job's checksums. Every artifact one job hands another is checked the
#     same way, against a job output, before anything uses it.
#   - classify, fetch, refresh: no secrets, read-only token. fetch and
#     refresh read what a pull request and its dependencies wrote, and
#     never execute any of it.
#   - review: the ONLY job with a model credential, and it holds nothing
#     else: no access to the repository, only the OIDC token it exchanges
#     for a short-lived Claude token. The model gets text in a request and
#     no tools; its answer is a closed structure that can only veto. This
#     job never runs on a schedule.
#   - publish: the ONLY job with the gate app's token (environment
#     `dep-review`, default branch only). No model, and no untrusted text
#     in any shell. It decides from the facts (internal/allow) and merges
#     only the head commit the facts name.
name: dep-review gate

on:
  workflow_call:
    inputs:
      trigger_workflow_path:
        description: The caller's no-op pull_request workflow whose completion starts the gate.
        type: string
        default: .github/workflows/dep-review-trigger.yaml
      app_slug:
        description: >-
          The gate app's slug: the name in https://github.com/apps/<slug>.
          Not a secret. The jobs without the app's token recognise the
          gate's own comment by it. publish fails when it is not the app
          whose key it holds.
        type: string
        required: true
      ignore_ecosystems:
        description: >-
          Comma-separated ecosystems, as in Dependabot's branch names (e.g.
          submodules, not gitsubmodule), whose PRs another trusted process
          owns. A verified Dependabot PR in one of these gets no status,
          comment or notification; anything else is gated as usual. An
          unknown name fails the run. Empty: none.
        type: string
        default: ""
      anthropic_federation_rule_id:
        type: string
        required: true
      anthropic_organization_id:
        type: string
        required: true
      anthropic_workspace_id:
        type: string
        default: ""
      anthropic_service_account_id:
        description: Service account (svac_...) the federated token acts as; optional.
        type: string
        default: ""
    # Declared so callers pass these and nothing else (no `secrets: inherit`).
    # publish runs in the caller's `dep-review` environment, and an
    # environment secret of the same name takes precedence over a passed
    # one, so the usual setup (all three as environment secrets) works with
    # the pass-through in examples/dep-review.yaml; none is required at call
    # time for that reason. publish fails without DEP_REVIEW_APP_KEY.
    secrets:
      DEP_REVIEW_APP_KEY:
        description: The gate app's private key (normally a `dep-review` environment secret).
        required: false
      PUSHOVER_APP_TOKEN:
        description: Optional Pushover notifications.
        required: false
      PUSHOVER_USER_KEY:
        description: Optional Pushover notifications.
        required: false

permissions: {}

env:
  # Backstops for "never run the dependencies' code".
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0"
  npm_config_ignore_scripts: "true"

jobs:
  # The trigger's only job runs for Dependabot's PRs alone, so a skipped
  # trigger run is someone else's PR: nothing to gate, and every job here
  # needs build, so skipping it skips the run (no billed minutes on every
  # push to every other PR). Any other conclusion still classifies.
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      gate_sums: ${{ steps.sums.outputs.sums }}
    steps:
      - name: Check out the gate (this workflow's own commit)
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gate
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: gate/go.mod
          cache: false
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -C gate -trimpath -o "$RUNNER_TEMP/bin/dep-review" ./cmd/dep-review
          # go.mod: fetch and refresh set up the gate's Go version from it.
          cp gate/go.mod "$RUNNER_TEMP/bin/"
      - name: Checksum the gate's files
        id: sums
        run: |
          cd "$RUNNER_TEMP/bin"
          {
            echo 'sums<<DEP_REVIEW_SUMS'
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            echo 'DEP_REVIEW_SUMS'
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
          retention-days: 1

  classify:
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      classification_sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact). The
      # same holds for every artifact below: each is checked against its
      # producer's job output.
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          diff <(find . -type f | sort) <(printf '%s\n' "$GATE_SUMS" | cut -c67- | sort)
          chmod +x dep-review
      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PATH: ${{ inputs.trigger_workflow_path }}
          IGNORE_ECOSYSTEMS: ${{ inputs.ignore_ecosystems }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" classify \
            --event "$GITHUB_EVENT_PATH" \
            --trigger-path "$TRIGGER_PATH" \
            --ignore-ecosystems "$IGNORE_ECOSYSTEMS" \
            --out "$RUNNER_TEMP/out/classification.json"
      - name: Checksum the artifact
        id: sums
        run: |
          cd "$RUNNER_TEMP/out"
          {
            echo 'sums<<DEP_REVIEW_SUMS'
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            echo 'DEP_REVIEW_SUMS'
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: classification
          path: ${{ runner.temp }}/out/classification.json
          retention-days: 7

  # The facts: the change set from the PR's git objects, what registries
  # and GitHub say about every update, and the text the model is to read.
  # It runs for a PR that is not Dependabot's alone too, and then writes
  # only that, which is how publish comes to tell a person; for a PR whose
  # proof is not finished yet it gathers everything and the PR waits.
  fetch:
    needs: [build, classify]
    if: >-
      needs.classify.outputs.kind == 'dependabot' ||
      needs.classify.outputs.kind == 'dependabot-unverified' ||
      needs.classify.outputs.kind == 'dependabot-pending'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # true when there is something for the model to read.
      review: ${{ steps.fetch.outputs.review }}
      facts_sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          diff <(find . -type f | sort) <(printf '%s\n' "$GATE_SUMS" | cut -c67- | sort)
          chmod +x dep-review
      - uses: actions/download-artifact@v8.0.2
        with:
          name: classification
          path: ${{ runner.temp }}/in
      - name: Verify the classification artifact
        env:
          SUMS: ${{ needs.classify.outputs.classification_sums }}
        run: |
          cd "$RUNNER_TEMP/in"
          printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -
          # ...and nothing else is there.
          diff <(find . -type f | sort) <(printf '%s\n' "$SUMS" | cut -c67- | sort)
      # The Go facts come from the go command (`go mod download` in an
      # empty module of its own: downloads and sum checks only). The
      # version comes from the gate's go.mod, never the PR's; no cache,
      # since a cache restored into a job that handles untrusted code can
      # be poisoned.
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: ${{ runner.temp }}/bin/go.mod
          cache: false
      - name: Check out the PR (data only; nothing from it is executed)
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Gather the facts
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ inputs.app_slug }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" fetch \
            --classification "$RUNNER_TEMP/in/classification.json" \
            --repo-dir pr \
            --out "$RUNNER_TEMP/facts" \
            --app-slug "$APP_SLUG"
      - name: Checksum the artifact
        id: sums
        run: |
          # One sum per file can pass the 128 KiB a single environment value
          # may hold, so the sums go into the artifact as SHA256SUMS and
          # the job outputs that file's own sum.
          cd "$RUNNER_TEMP/facts"
          find . -type f -print0 | sort -z | xargs -0 sha256sum >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" ./SHA256SUMS
          {
            echo 'sums<<DEP_REVIEW_SUMS'
            sha256sum ./SHA256SUMS
            echo 'DEP_REVIEW_SUMS'
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: facts
          path: ${{ runner.temp }}/facts
          retention-days: 7

  # The veto calls: one tool-less Messages API request for each chunk of
  # text fetch prepared. To this job a chunk is bytes; it checks them
  # against the facts file's hashes and sends them.
  review:
    needs: [build, fetch]
    # Only for an event's run: the federation rule admits no other, and
    # the scheduled path asks no model.
    if: github.event_name == 'workflow_run' && needs.fetch.outputs.review == 'true'
    runs-on: ubuntu-26.04
    # `dep-review review` stops asking after 100 minutes and writes what
    # it has.
    timeout-minutes: 120
    outputs:
      verdicts_sums: ${{ steps.sums.outputs.sums }}
    permissions:
      # The federated model credential, and nothing else: no access to
      # the repository. Artifacts of the same run need none.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          diff <(find . -type f | sort) <(printf '%s\n' "$GATE_SUMS" | cut -c67- | sort)
          chmod +x dep-review
      - uses: actions/download-artifact@v8.0.2
        with:
          name: facts
          path: ${{ runner.temp }}/facts
      - name: Verify the facts artifact
        env:
          SUMS: ${{ needs.fetch.outputs.facts_sums }}
        run: |
          cd "$RUNNER_TEMP/facts"
          # The manifest is the one fetch summed, then every file is in it...
          printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -
          sha256sum --check --strict --quiet ./SHA256SUMS
          # ...and nothing else is there.
          diff <(find . -type f ! -path ./SHA256SUMS | sort) <(cut -c67- ./SHA256SUMS | sort)
      # With no verdict for a read (the model did not answer, this step
      # failed) the read counts as not done, and the PR waits.
      - name: Review
        env:
          RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
          ORG_ID: ${{ inputs.anthropic_organization_id }}
          WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
          SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" review \
            --facts "$RUNNER_TEMP/facts" \
            --out "$RUNNER_TEMP/verdicts" \
            --federation-rule-id "$RULE_ID" \
            --organization-id "$ORG_ID" \
            --workspace-id "$WORKSPACE_ID" \
            --service-account-id "$SERVICE_ACCOUNT_ID"
      - name: Checksum the artifact
        id: sums
        run: |
          cd "$RUNNER_TEMP/verdicts"
          {
            echo 'sums<<DEP_REVIEW_SUMS'
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            echo 'DEP_REVIEW_SUMS'
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verdicts
          path: ${{ runner.temp }}/verdicts/verdicts.json
          retention-days: 7

  # The scheduled path: for every Dependabot PR the gate left waiting,
  # the identity proof and the facts again, with the verdicts the gate's
  # comment remembers. No model is asked and there is no credential to
  # ask one with; publish then decides, as for an event.
  refresh:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # true when there is a refreshed PR for publish to decide.
      publish: ${{ steps.refresh.outputs.publish }}
      refreshed_sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gate-bin
          path: ${{ runner.temp }}/bin
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          diff <(find . -type f | sort) <(printf '%s\n' "$GATE_SUMS" | cut -c67- | sort)
          chmod +x dep-review
      # As in fetch: the gate's Go version, no cache.
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: ${{ runner.temp }}/bin/go.mod
          cache: false
      # Every branch, so the PRs' heads are there; the working tree is the
      # default branch's and is not looked at.
      - name: Check out the repository (data only; nothing from it is executed)
        uses: actions/checkout@v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh the waiting PRs
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ inputs.app_slug }}
          IGNORE_ECOSYSTEMS: ${{ inputs.ignore_ecosystems }}
        run: |
          "$RUNNER_TEMP/bin/dep-review" refresh \
            --repo-dir repo \
            --out "$RUNNER_TEMP/refreshed" \
            --app-slug "$APP_SLUG" \
            --ignore-ecosystems "$IGNORE_ECOSYSTEMS"
      - name: Checksum the artifact
        id: sums
        if: steps.refresh.outputs.publish == 'true'
        run: |
          # As for the facts artifact: the sums go into the artifact as
          # SHA256SUMS and the job outputs that file's own sum.
          cd "$RUNNER_TEMP/refreshed"
          find . -type f -print0 | sort -z | xargs -0 sha256sum >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" ./SHA256SUMS
          {
            echo 'sums<<DEP_REVIEW_SUMS'
            sha256sum ./SHA256SUMS
            echo 'DEP_REVIEW_SUMS'
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        if: steps.refresh.outputs.publish == 'true'
        with:
          name: refreshed
          path: ${{ runner.temp }}/refreshed
          retention-days: 1
      # After the upload, so the PRs that were refreshed are still decided.
      - name: Fail when a PR could not be refreshed
        if: steps.refresh.outputs.incomplete == 'true'
        run: |
          echo "a waiting PR could not be refreshed; see the step above" >&2
          exit 1

  publish:
    needs: [build, classify, fetch, review, refresh]
    # review and refresh are each skipped on one of the two paths, and a
    # review that failed still leaves facts to decide on (its reads wait).
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.fetch.result == 'success' || needs.refresh.outputs.publish == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: dep-review
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/in
          pattern: "{gate-bin,classification,facts,verdicts,refreshed}"
      # gate-bin is an artifact of this run, and anything holding the
      # run's runtime token can replace one. Use it only if every file
      # matches the build job's checksums (a job output, not an artifact).
      - name: Verify the gate's files
        env:
          GATE_SUMS: ${{ needs.build.outputs.gate_sums }}
        run: |
          cd "$RUNNER_TEMP/in/gate-bin"
          printf '%s\n' "$GATE_SUMS" | sha256sum --check --strict --quiet -
          diff <(find . -type f | sort) <(printf '%s\n' "$GATE_SUMS" | cut -c67- | sort)
          chmod +x dep-review
      - name: Verify the classification artifact
        env:
          SUMS: ${{ needs.classify.outputs.classification_sums }}
        run: |
          # None if the job that makes it did not run or succeed; then
          # there must be no artifact either.
          if [ -z "$SUMS" ]; then test ! -e "$RUNNER_TEMP/in/classification"; exit; fi
          cd "$RUNNER_TEMP/in/classification"
          printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -
          # ...and nothing else is there.
          diff <(find . -type f | sort) <(printf '%s\n' "$SUMS" | cut -c67- | sort)
      - name: Verify the facts artifact
        env:
          SUMS: ${{ needs.fetch.outputs.facts_sums }}
        run: |
          if [ -z "$SUMS" ]; then test ! -e "$RUNNER_TEMP/in/facts"; exit; fi
          cd "$RUNNER_TEMP/in/facts"
          # The manifest is the one fetch summed, then every file is in it...
          printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -
          sha256sum --check --strict --quiet ./SHA256SUMS
          # ...and nothing else is there.
          diff <(find . -type f ! -path ./SHA256SUMS | sort) <(cut -c67- ./SHA256SUMS | sort)
      - name: Verify the verdicts artifact
        env:
          SUMS: ${{ needs.review.outputs.verdicts_sums }}
        run: |
          if [ -z "$SUMS" ]; then test ! -e "$RUNNER_TEMP/in/verdicts"; exit; fi
          # Sums without an artifact (the upload failed after the sums
          # step) are no verdicts: every read then counts as not done.
          if [ ! -e "$RUNNER_TEMP/in/verdicts" ]; then echo "no verdicts artifact; the reads wait"; exit; fi
          cd "$RUNNER_TEMP/in/verdicts"
          printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -
          # ...and nothing else is there.
          diff <(find . -type f | sort) <(printf '%s\n' "$SUMS" | cut -c67- | sort)
      - name: Verify the refreshed artifact
        env:
          SUMS: ${{ needs.refresh.outputs.refreshed_sums }}
        run: |
          if [ -z "$SUMS" ]; then test ! -e "$RUNNER_TEMP/in/refreshed"; exit; fi
          cd "$RUNNER_TEMP/in/refreshed"
          printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -
          sha256sum --check --strict --quiet ./SHA256SUMS
          # ...and nothing else is there.
          diff <(find . -type f ! -path ./SHA256SUMS | sort) <(cut -c67- ./SHA256SUMS | sort)
      - name: Gate app token (this repository only)
        id: app
        uses: actions/create-github-app-token@v3.4.0
        with:
          app-id: ${{ vars.DEP_REVIEW_APP_ID }}
          private-key: ${{ secrets.DEP_REVIEW_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write
      # fetch and refresh looked for the gate's comment under the input's
      # name. If that is not this app, they found none, and no verdict
      # was reused and no waiting PR refreshed: say so loudly.
      - name: The app_slug input names this app
        env:
          INPUT_SLUG: ${{ inputs.app_slug }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ "$INPUT_SLUG" != "$APP_SLUG" ]; then
            echo "the app_slug input is not the slug of the app whose key this job holds" >&2
            exit 1
          fi
      - name: Decide, comment, merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # "<slug>[bot]" is how publish recognises its own comment.
          DEP_REVIEW_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          "$RUNNER_TEMP/in/gate-bin/dep-review" publish --in "$RUNNER_TEMP/in"
