name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # sadbox/ci's Go checks (gofmt, go vet, go test -race, golangci-lint,
  # govulncheck) on linux/amd64 and linux/arm64, with go.mod's Go (there is
  # no image). -timeout 20m: a package's tests under -race have passed go
  # test's default 10-minute limit per test binary on the runner (#39). The
  # job also builds the tools and lints, hence 30 minutes. -count=1: a go
  # test pass from setup-go's cache never stands in for a run.
  go:
    uses: sadbox/ci/.github/workflows/go.yml@d22f8f95bcc884ba539ce3f53c552823cff3230d # v0.6.0
    permissions:
      contents: read
    with:
      go-versions: '["go.mod"]'
      go-test-flags: -count=1 -timeout 20m
      timeout-minutes: 30

  # sadbox/ci's linters (actionlint, zizmor, shellcheck, whichever apply)
  # and gh actions-lock --verify. testdata/ is left out: it holds recorded
  # registry answers and lockfiles whose pinned dependencies are the point
  # of the fixture, and an advisory on one would fail npm audit or
  # osv-scanner for no change.
  lint:
    uses: sadbox/ci/.github/workflows/lint.yml@359d60377cc875e8370724de433e72493c6d33b1 # v0.2.0
    permissions:
      contents: read
    with:
      exclude: '(^|/)testdata/'
