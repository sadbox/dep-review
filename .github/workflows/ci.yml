name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        # -race needs cgo.
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout 20m ./...

  # sadbox/ci's linters (actionlint, zizmor, shellcheck, whichever apply)
  # and gh actions-lock --verify. testdata/ is left out: it holds recorded
  # registry answers and lockfiles whose pinned dependencies are the point
  # of the fixture, and an advisory on one would fail npm audit or
  # osv-scanner for no change.
  lint:
    uses: sadbox/ci/.github/workflows/lint.yml@359d60377cc875e8370724de433e72493c6d33b1 # v0.2.0
    permissions:
      contents: read
    with:
      exclude: '(^|/)testdata/'
