# What ./ap runs: ansible-core plus the `ansible` package's collections
# (community.general.ufw). uv.lock pins every package, transitive ones
# included, by version and hash; ./ap installs exactly that (uv run --locked)
# and Dependabot (uv ecosystem) proposes updates as PRs.
[project]
name = "bonnet-ansible"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "ansible-core==2.21.6",
    "ansible==14.6.0",
]

[tool.uv]
package = false
