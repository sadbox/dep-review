name: publish
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000000 # v7
      - uses: docker/setup-qemu-action@0000000000000000000000000000000000000000 # v4
      - uses: docker/setup-buildx-action@0000000000000000000000000000000000000000 # v4
      - name: Build and push
        uses: docker/build-push-action@0000000000000000000000000000000000000000 # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
