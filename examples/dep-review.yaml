# Copy to .github/workflows/dep-review.yaml and set app_slug and the three
# Anthropic IDs (identifiers, not secrets). Needs an environment `dep-review`
# (default branch only) with variable DEP_REVIEW_APP_ID and secret
# DEP_REVIEW_APP_KEY, and optionally secrets PUSHOVER_APP_TOKEN /
# PUSHOVER_USER_KEY. The gate's own settings (ages, the list) are built
# into the gate; a repository has no settings file.
name: dep-review

on:
  workflow_run:
    workflows: [dep-review-trigger]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *" # looks again at the PRs the gate left waiting
  workflow_dispatch:

permissions: {}

# Keyed on the head repository too, so a fork PR on a same-named branch can't
# share (and displace a queued run in) a Dependabot PR's group.
concurrency:
  group: dep-review-${{ github.event.workflow_run.head_repository.full_name || 'schedule' }}-${{ github.event.workflow_run.head_branch || 'schedule' }}
  cancel-in-progress: false

jobs:
  gate:
    uses: sadbox/dep-review/.github/workflows/gate.yml@0000000000000000000000000000000000000000 # vX.Y.Z
    # The most any of the gate's jobs may ask for. Only its review job takes
    # id-token, and that job runs for a workflow_run event only.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    # Only the gate's own secrets; never `secrets: inherit`, which would hand
    # the reusable workflow every secret this repository has.
    secrets:
      DEP_REVIEW_APP_KEY: ${{ secrets.DEP_REVIEW_APP_KEY }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
    with:
      # The gate app's slug: the name in https://github.com/apps/<slug>.
      app_slug: REPLACE
      anthropic_federation_rule_id: fdrl_REPLACE
      anthropic_organization_id: REPLACE
      anthropic_workspace_id: wrkspc_REPLACE
      # Only when another trusted process owns these ecosystems' Dependabot
      # PRs (e.g. a routine that supersedes every submodule bump with its
      # own PR): verified Dependabot PRs in them get no status, comment or
      # notification. Names as in Dependabot's branch names (submodules, not
      # gitsubmodule); an unknown name fails the run.
      # ignore_ecosystems: submodules
