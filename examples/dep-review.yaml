# Copy to .github/workflows/dep-review.yaml and set the three Anthropic IDs
# (identifiers, not secrets). Needs an environment `dep-review` (default
# branch only) with variable DEP_REVIEW_APP_ID and secret DEP_REVIEW_APP_KEY,
# and optionally secrets PUSHOVER_APP_TOKEN / PUSHOVER_USER_KEY.
name: dep-review

on:
  workflow_run:
    workflows: [dep-review-trigger]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *" # sweep: merge approved PRs whose CI finished later
  workflow_dispatch:

permissions: {}

# Keyed on the head repository too, so a fork PR on a same-named branch can't
# share (and displace a queued run in) a Dependabot PR's group.
concurrency:
  group: dep-review-${{ github.event.workflow_run.head_repository.full_name || 'sweep' }}-${{ github.event.workflow_run.head_branch || 'sweep' }}
  cancel-in-progress: false

jobs:
  gate:
    uses: sadbox/dep-review/.github/workflows/gate.yml@0000000000000000000000000000000000000000 # vX.Y.Z
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    # Only the gate's own secrets; never `secrets: inherit`, which would hand
    # the reusable workflow every secret this repository has.
    secrets:
      DEP_REVIEW_APP_KEY: ${{ secrets.DEP_REVIEW_APP_KEY }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
    with:
      anthropic_federation_rule_id: fdrl_REPLACE
      anthropic_organization_id: REPLACE
      anthropic_workspace_id: wrkspc_REPLACE
      # Must list exactly the platforms this repository builds its images for.
      docker_platforms: linux/amd64,linux/arm64
      # Every GOOS/GOARCH the repository builds Go for (CI, release and
      # developer machines), and the tags those builds set. Go module checks
      # then skip files none of them compiles; a build missing here is not
      # checked. Omit both to check every platform.
      go_platforms: linux/amd64,linux/arm64,darwin/arm64
      go_tags: ""
      # Only when another trusted process owns these ecosystems' Dependabot
      # PRs (e.g. a routine that supersedes every submodule bump with its
      # own PR): verified Dependabot PRs entirely in them get no status,
      # comment or notification. Names as in Dependabot's branch names
      # (submodules, not gitsubmodule); an unknown name fails the run.
      # ignore_ecosystems: submodules
